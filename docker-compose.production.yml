version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: pokemon-api-app-prod
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/production.ini
    networks:
      - pokemon-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: pokemon-api-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - pokemon-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: pokemon-api-db-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pokemon_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: pokemon_user
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pokemon-network
    command: --default-authentication-plugin=mysql_native_password --ssl=0

networks:
  pokemon-network:
    driver: bridge

volumes:
  db_data:
    driver: local
