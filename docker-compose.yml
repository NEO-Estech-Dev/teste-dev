services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pokeapi-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pokeapi

  nginx:
    image: nginx:1.27-alpine
    container_name: pokeapi-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pokeapi

  mysql:
    image: mysql:8.0
    container_name: pokeapi-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: pokeapi
      MYSQL_USER: pokeapi
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pokeapi

networks:
  pokeapi:
    driver: bridge

volumes:
  mysql_data:
